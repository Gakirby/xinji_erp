# =====================================================================
#  鑫基矿业 ERP · Nginx 站点配置
#  一个域名下挂三个前端 + 一个后端，路径即隔离边界：
#    /        网页商城（mall）
#    /admin/  运营后台（admin）
#    /m/      手机端 / 小程序 H5（mobile）
#    /api/    反向代理到后端 Spring Boot
# =====================================================================

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    client_max_body_size 20m;

    # ---------- 压缩 ----------
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml application/xml+rss text/javascript image/svg+xml;

    # ---------- 基础安全头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass         http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /actuator/ {
        proxy_pass       http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---------- 运营后台（history 路由回退） ----------
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 手机端（history 路由回退） ----------
    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }

    # ---------- 带指纹的静态资源：长缓存 ----------
    location ~* ^/(admin/|m/)?assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- 入口 HTML：不缓存，保证发版即生效 ----------
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /admin/index.html {
        add_header Cache-Control "no-store";
    }
    location = /m/index.html {
        add_header Cache-Control "no-store";
    }

    # ---------- 网页商城首页（history 路由回退） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 错误页 ----------
    # 注意：这里不能写 error_page 404 /index.html。
    # 三端的路由回退已由上面的 try_files 处理；若把 404 也改成首页，
    # 缺失的 .js/.css 会以 text/html 返回，浏览器会报 MIME 类型错误。
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>服务暂时不可用</title><div style="font-family:system-ui;padding:60px;text-align:center;color:#49535f"><h2 style="font-weight:500">服务正在重启，请稍后刷新</h2></div>';
    }
}
